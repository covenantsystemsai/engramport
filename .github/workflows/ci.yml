name: ci

# Runs on every pull request and every push to main. A red check blocks the
# merge once branch protection requires it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Fails on any known high or critical vulnerability in what ships to users.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scans the full history of the branch for committed keys and tokens.
      # The CLI image needs no license, unlike the gitleaks GitHub Action on orgs.
      # The container runs as root over a runner-owned checkout, so git needs
      # the mount marked safe, or gitleaks reads nothing and still exits 0.
      # The grep makes a scan that could not read the repo fail the job.
      - name: Secret scan
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --redact --verbose --exit-code=1 2>&1 | tee gitleaks.log
          if grep -q "failed to scan" gitleaks.log || ! grep -q "commits scanned" gitleaks.log; then
            echo "::error::gitleaks did not scan the repository"
            exit 1
          fi

  # Applies the SQL migrations to a throwaway Postgres with pgvector and runs
  # the row security tests: every cross-namespace and cell-to-cell read or
  # write must fail. Then runs the server's store against it as the app role.
  # Postgres 17 matches the Supabase project.
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          # Throwaway container that lives only for this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Migrations and row security tests
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres
        run: db/test/run.sh

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The server's Postgres store, run as engramport_app on a fresh database.
      - name: Store tests
        env:
          ADMIN_URL: postgresql://postgres@localhost:5432
        run: |
          psql "$ADMIN_URL/postgres" -X -q -v ON_ERROR_STOP=1 -c 'CREATE DATABASE store_test'
          DATABASE_URL="$ADMIN_URL/store_test" db/migrate.sh
          ENGRAMPORT_TEST_DATABASE_URL="$ADMIN_URL/store_test" npm run test:store
